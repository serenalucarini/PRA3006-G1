<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Document metadata and page configuration -->
    <meta charset="UTF-8"> <!-- Ensures proper text encoding -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Responsive design -->
    <title>Bar chart: Risk Factors vs. Diseases</title> <!-- Page title displayed on browser tab -->

    <!-- Load the D3.js library from CDN for rendering visualizations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

    <style>
        * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
        }

        html, body {
          height: 100%;
          width: 100%;
          font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; 
          background-color: #FBF9F1;
        }

        .header {
          position: fixed;
          left: 0;
          top: 0;
          width: 100%;
          height: 15%;
          background-color: #E5E1DA;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 2rem;
          box-sizing: border-box;
          z-index: 10;
        }

        .header-left,
        .header-center,
        .header-right {
          display: flex;
          align-items: center;
          gap: 1rem;
        }
        .header-left { flex: 1; justify-content: flex-start; }
        .header-center { flex: 1; justify-content: center; }
        .header-right { flex: 1; justify-content: flex-end; }

        .title {
          margin: 0;
          font-size: 1.1rem;
          font-weight: 600;
          text-align: center;
        }

        .nav-link {
          color: inherit;
          text-decoration: none;
          cursor: pointer;
          font-size: 1rem;
        }
        .nav-link:focus {
          outline: 2px solid rgba(0,0,0,0.15);
          outline-offset: 2px;
        }

        .body {
          position: relative;
          top: 80px;
          left: 0;
          width: 100%;
          height: auto;
          min-height: calc(100vh - 15% - 20%);
          color: black;
          padding: 2rem;
          padding-bottom: 3.5rem;
          overflow-y: auto;
          overflow-x: hidden;
        }

        .intro-box {
          max-width: 900px;
          margin: 0 auto 1.25rem auto;
          background: #fff;
          border-radius: 12px;
          padding: 1.5rem 1.75rem;
          box-shadow: 0 6px 18px rgba(0,0,0,0.08);
          color: #111;
        }
        .intro-box h2 {
          margin-bottom: 0.5rem;
          font-size: 1.25rem;
        }
        .intro-box p {
          line-height: 1.5;
          color: #222;
        }

        .body-links {
          max-width: 900px;
          margin: 0.25rem auto 2rem auto;
          display: flex;
          gap: 1rem;
          justify-content: center;
          align-items: center;
          flex-wrap: wrap;
        }

        .content-link {
          color: inherit;
          text-decoration: none;
          padding: 0.25rem 0.5rem;
          border-radius: 6px;
          transition: color 120ms ease, background 120ms ease;
        }
        .content-link:hover {
          text-decoration: underline;
          color: rgba(118, 97, 97, 1);
          background: rgba(118, 97, 97, 0.2);
        }

        .content-section {
          max-width: 900px;
          margin: 1.5rem auto;
          display: flex;
          gap: 1.5rem;
          align-items: flex-start;
        }
        .content-section img {
          flex-shrink: 0;
        }
        .content-section p {
          margin: 0.5rem 0 0 0;
        }

        .footer {
          position: static;
          left: 0;
          bottom: 0;
          width: 100%;
          height: 20%;
          background-color: #E5E1DA;
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 0 2%;
          box-sizing: border-box;
          z-index: 10;
        }
        .footer > div {
          display: flex;
          flex-direction: column;
          gap: 0.5rem;
          align-items: center;
        }
        .footer .title {
          margin: 0;
          font-size: 0.95rem;
          font-weight: 600;
          text-align: center;
        }
        .footer .title p {
          margin: 0;
        }
        .footer .nav-link {
          font-size: 0.85rem;
          color: inherit;
          text-decoration: none;
          cursor: pointer;
          pointer-events: auto;
          display: inline-block;
          position: relative;
          z-index: 20;
        }
        .footer .nav-link:hover {
          text-decoration: underline;
          color: rgba(118, 97, 97, 1);
        }
        .footer .nav-link.title {
          font-size: 0.95rem;
          font-weight: 600;
        }
        .footer_date {
          font-size: 0.85rem;
          text-align: center;
        }
    </style>
</head>
<body>
    <!-- Header with navigation -->
    <div class="header">
        <div><a href="BarCharts.html">← Back</a></div>
        <h1 class="title">Diseases per risk factor</h1>
        <div style="width: 60px;"></div> <!-- Spacer to balance layout -->
    </div>

    <div class="body">
        <!-- Chart section -->
        <div id="chart-wrapper">
            <div id="loading-message">Loading data...</div> <!-- Initial loading text -->
            <div id="barchart-container"></div> <!-- D3 renders chart here -->
        </div>

        <!-- Diseases panel dynamically updated when clicking a factor -->
        <div id="diseases-panel" aria-hidden="true">
            <div class="diseases-title" id="selected-factor"></div>
            <ul class="diseases-list" id="diseases-list"></ul>
        </div>
    </div>

    <!-- Footer section -->
    <div class="footer">
        <img src="um_logo.png" alt="Logo of Maastricht University" width="44.92" height="50.28" style="opacity:0.5;"> <!-- University logo -->
        <div class="title"><a href="AboutUs.html">About Us</a></div>
        <small class="footer_date">
            <p>created: 31/10/2025</p>
            <p>last updated: 24/11/2025</p>
        </small>
    </div>

    <script>
        /*===========================================
          GLOBAL VARIABLES
        ===========================================*/
        const sparqlEndpoint = "https://query.wikidata.org/sparql"; // Wikidata API endpoint
        let allData = [];   // Storage for all retrieved raw data
        let selectedFactor = null; // Currently active/selected risk factor


        /*===========================================
          FUNCTION: Fetch SPARQL Data
        ===========================================*/
        async function fetchData() {
            const loadingMessage = document.getElementById("loading-message");
            loadingMessage.textContent = "Loading data...";

            // SPARQL query: retrieves diseases and associated risk factors
            const sparqlQuery = `
            SELECT ?disease ?diseaseLabel ?factor ?factorLabel
            WHERE {
              ?disease wdt:P5642 wd:Q662860.  /* Select diseases with risk factor */
              ?disease wdt:P5642 ?factor .    /* Retrieve risk factors */
              SERVICE wikibase:label { bd:serviceParam wikibase:language "[AUTO_LANGUAGE],mul,en". }
            }`;

            try {
                // Perform HTTP GET request to Wikidata API
                const response = await fetch(`${sparqlEndpoint}?query=${encodeURIComponent(sparqlQuery)}`, {
                    headers: { Accept: "application/json" },
                });

                if (!response.ok) {
                    throw new Error(`Network response was not ok: ${response.statusText}`);
                }

                const json = await response.json();

                // Transform results into clean JS objects
                return json.results.bindings.map((row) => ({
                    disease: row.disease.value,
                    diseaseLabel: row.diseaseLabel.value,
                    factor: row.factor.value,
                    factorLabel: row.factorLabel.value,
                }));
            } catch (error) {
                console.error("Error fetching data:", error);
                loadingMessage.textContent = "Error loading data. Please try again.";
                return [];
            }
        }


        /*===========================================
          FUNCTION: Prepare chart data
        ===========================================*/
        function prepareChartData(data) {
            // Group entries by factor label
            const groupedByFactor = d3.group(data, (d) => d.factorLabel);

            // Convert grouped map into array of objects
            return Array.from(groupedByFactor, ([factor, values]) => {
                const uniqueDiseases = new Set(values.map(v => v.disease));
                return {
                    factor: factor,
                    count: uniqueDiseases.size
                };
            }).sort((a, b) => b.count - a.count); // Sort descending by number of diseases
        }


        /*===========================================
          FUNCTION: Get diseases by risk factor
        ===========================================*/
        function getDiseasesByFactor(factorName) {
            const factorData = allData.filter(d => d.factorLabel === factorName);
            const uniqueDiseases = [...new Set(factorData.map(d => d.diseaseLabel))];
            return uniqueDiseases.sort();
        }


        /*===========================================
          FUNCTION: Display diseases in side panel
        ===========================================*/
        function displayDiseases(factorName) {
            const diseases = getDiseasesByFactor(factorName);
            const panel = document.getElementById("diseases-panel");
            const titleEl = document.getElementById("selected-factor");
            const listEl = document.getElementById("diseases-list");

            const count = diseases.length;
            titleEl.textContent = `${factorName} (${count} ${count === 1 ? 'disease' : 'diseases'})`;

            // Clear previous list
            listEl.innerHTML = "";

            // Populate with new diseases
            diseases.forEach(disease => {
                const li = document.createElement("li");
                li.className = "disease-item";
                li.textContent = disease;
                listEl.appendChild(li);
            });

            panel.classList.add("active");
            panel.setAttribute("aria-hidden", "false");
        }


        /*===========================================
          FUNCTION: Hide diseases panel
        ===========================================*/
        function hideDiseases() {
            const panel = document.getElementById("diseases-panel");
            panel.classList.remove("active");
            panel.setAttribute("aria-hidden", "true");
            selectedFactor = null;
        }


        /*===========================================
          FUNCTION: Draw bar chart using D3.js
        ===========================================*/
        function drawChart(chartData) {
            const container = document.getElementById("barchart-container");
            const availableWidth = container.clientWidth;
            const availableHeight = container.clientHeight;

            // Define margins dynamically based on viewport
            const margin = {
                top: 20,
                right: 30,
                left: 60,
                bottom: Math.min(220, Math.max(100, Math.floor(availableHeight * 0.25)))
            };

            const width = availableWidth - margin.left - margin.right;
            const height = availableHeight - margin.top - margin.bottom;

            // Clear any existing SVG before re-rendering
            container.innerHTML = "";

            // Create root SVG element
            const svg = d3
                .select("#barchart-container")
                .append("svg")
                .attr("width", "100%")
                .attr("height", "100%")
                .attr("viewBox", `0 0 ${availableWidth} ${availableHeight}`)
                .attr("role", "img")
                .attr("aria-label", "Bar chart showing number of diseases per risk factor")
                .style("display", "block")
                .append("g")
                .attr("transform", `translate(${margin.left},${margin.top})`);

            // X-axis: categorical scale for factors
            const x = d3.scaleBand()
                .range([0, width])
                .domain(chartData.map(d => d.factor))
                .padding(0.2);

            // Y-axis: linear scale for disease counts
            const y = d3.scaleLinear()
                .range([height, 0])
                .domain([0, d3.max(chartData, d => d.count)]);

            // Draw bars
            svg.selectAll(".bar")
                .data(chartData)
                .join("rect")
                .attr("class", "bar")
                .attr("x", d => x(d.factor))
                .attr("y", d => y(d.count))
                .attr("width", x.bandwidth())
                .attr("height", d => Math.max(0, height - y(d.count)))
                .attr("fill", "#FF69B4") /* Default pink fill */
                .on("click", function(event, d) {
                    // Toggle selection behavior
                    if (selectedFactor === d.factor) {
                        svg.selectAll(".bar").classed("active", false);
                        hideDiseases();
                    } else {
                        svg.selectAll(".bar").classed("active", false);
                        d3.select(this).classed("active", true);
                        selectedFactor = d.factor;
                        displayDiseases(d.factor);
                        const panel = document.getElementById("diseases-panel");
                        if (panel) panel.scrollIntoView({ behavior: "smooth", block: "nearest" });
                    }
                })
                .append("title") // Tooltip on hover
                .text(d => `${d.factor}: ${d.count} diseases`);

            // Add X-axis
            const xAxis = svg.append("g")
                .attr("transform", `translate(0,${height})`)
                .call(d3.axisBottom(x));

            // Rotate labels for readability
            xAxis.selectAll("text")
                .attr("transform", "rotate(-45)")
                .style("text-anchor", "end")
                .style("fill", "#000000");

            // Add Y-axis
            const yAxis = svg.append("g")
                .call(d3.axisLeft(y).ticks(10));

            yAxis.selectAll("text")
                .style("fill", "#000000");

            // Y-axis title
            svg.append("text")
                .attr("transform", "rotate(-90)")
                .attr("y", 0 - margin.left)
                .attr("x", 0 - (height / 2))
                .attr("dy", "1em")
                .style("text-anchor", "middle")
                .style("fill", "#000000")
                .text("Number of Diseases");

            // X-axis title
            svg.append("text")
                .attr("transform", `translate(${width / 2}, ${height + margin.bottom - 10})`)
                .style("text-anchor", "middle")
                .style("fill", "#000000")
                .text("Risk Factors");
        }


        /*===========================================
          INITIALIZE PAGE
        ===========================================*/
        async function init() {
            allData = await fetchData(); // Load data

            if (allData.length === 0) {
                console.warn("No data available to display");
                return;
            }

            console.log("Raw Data:", allData);

            const chartData = prepareChartData(allData);
            console.log("Chart Data:", chartData);

            if (chartData.length > 0) {
                // Hide loading message once ready
                document.getElementById("loading-message").style.display = "none";
                drawChart(chartData);

                // Redraw chart on window resize (debounced)
                let resizeTimeout;
                window.addEventListener("resize", () => {
                    clearTimeout(resizeTimeout);
                    resizeTimeout = setTimeout(() => {
                        drawChart(chartData);
                    }, 200);
                });
            }
        }

        // Run initialization
        init();
    </script>
</body>
</html>
