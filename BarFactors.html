<!DOCTYPE html>
<html lang="en">
<head>
    <!--
        BarFactors.html
        Visualization: Diseases per Risk Factor (bar chart)
        - Added inline comments throughout (HTML/CSS/JS) as requested.
        - Adjusted layout using CSS variables and viewport-based heights so the x-axis labels are always rendered inside the scrolling body (and do not get cut by the fixed footer).
        - Chart sizing is now computed from the container size so bars and rotated labels stay visible above the footer.
    -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disease Risk Factors Visualization</title>

    <!-- D3 library for drawing the bar chart -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

    <style>
        /* 
            Use CSS variables for header/footer heights so we can reliably
            compute body height relative to them and avoid the x-axis being
            cut by the footer (which is fixed).
        */
        :root {
            --header-height: 15vh; /* header height (viewport-based) */
            --footer-height: 15vh; /* footer height (viewport-based) */
            --body-padding: 2rem;  /* internal padding for the scrolling body */
        }

        /* Header and footer are fixed to the top and bottom respectively */
        .header, .footer {
            position: fixed;
            left: 0;
            width: 100%;
            height: var(--header-height); /* consistent, viewport-based height */
            background-color: Lavender;
            color: black;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
        }
        
        /* Header stays at the top */
        .header {
            top: 0;
            padding: 0 15%;
        }

        /* Footer stays at the bottom and uses the footer variable */
        .footer {
            bottom: 0;
            padding: 0 2%;
            height: var(--footer-height); /* explicitly set using the variable */
            box-sizing: border-box;
        }

        /*
            The body is positioned between header and footer.
            We use a calc(100vh - header - footer) so it always fits in the remaining viewport
            and its content (including SVG axes) cannot be hidden behind the footer.
        */
        .body {
            position: fixed;
            top: var(--header-height); /* start after the header */
            left: 0;
            width: 100%;
            height: calc(100vh - var(--header-height) - var(--footer-height)); /* remaining space */
            color: black;
            padding: var(--body-padding);
            overflow: auto; /* allow scrolling if chart is taller than the available space */
            display: flex;
            gap: 2rem;
            box-sizing: border-box;
        }

        /* Title in the header centered horizontally */
        .title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
        }

        .footer_date {
            text-align: right;
        }

        /* Loading message shown while SPARQL query runs */
        #loading-message {
            text-align: center;
            font-size: 18px;
            color: #333;
            margin: 20px 0;
        }

        /*
            barchart-container: holds the SVG.
            Ensure it doesn't shrink too small with a min-width.
            Add bottom padding to give visual breathing room within the scrolling body.
        */
        #barchart-container {
            flex: 1;
            min-width: 500px;
            padding-bottom: 1rem; /* spacing between SVG and container bottom */
            box-sizing: border-box;
        }

        /*
            Right-side panel for listing diseases associated with a chosen factor.
            Initially hidden and revealed when a bar is clicked.
        */
        #diseases-panel {
            flex: 0 0 400px;
            background-color: #f5f5f5;
            border: 2px solid #FF69B4;
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
            display: none; /* hidden by default */
        }
        
        /* When active, the panel is shown */
        #diseases-panel.active {
            display: block;
        }
        
        .diseases-title {
            font-size: 20px;
            font-weight: bold;
            color: #FF69B4;
            margin-bottom: 15px;
        }
        
        .diseases-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .disease-item {
            background-color: white;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-left: 4px solid #FF69B4;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .hidden {
            display: none;
        }
        
        /* Styling for bars, transitions and hover state */
        .bar {
            transition: opacity 0.3s, fill 0.3s;
            cursor: pointer;
        }
        
        .bar:hover {
            opacity: 0.8;
        }
        
        .bar.active {
            fill: #FF1493 !important; /* highlight color for active bar */
        }

        /*
            Make sure axis labels and lines are legible against the background.
            All axis text is enforced to use black fill in the script below as well,
            but we add a CSS fallback here.
        */
        .axis text {
            fill: #000000;
        }
    </style>
</head>
<body>
    <!-- Header with a back link and centered title -->
    <div class="header">
        <div><a href="BarCharts.html">Back</a></div>
        <h1 class="title">Diseases per Risk Factor</h1>
        <div></div>
    </div>
    
    <!--
        Main content area (scrollable).
        Left: chart (takes remaining flex space).
        Right: optional panel listing diseases when a bar is clicked.
    -->
    <div class="body">
        <div style="flex: 1;">
            <!-- Loading text appears while data is being fetched -->
            <div id="loading-message">Loading data...</div>
            <!-- Container where the chart SVG will be appended by D3 -->
            <div id="barchart-container"></div>
        </div>
        <!-- Panel that lists diseases for the selected factor -->
        <div id="diseases-panel" aria-hidden="true">
            <div class="diseases-title" id="selected-factor"></div>
            <ul class="diseases-list" id="diseases-list"></ul>
        </div>
    </div>
    
    <!-- Footer with logo, about link and dates -->
    <div class="footer">
        <img src="um_logo.png" alt="Logo of Maastricht University" width="44.92" height="50.28">
        <div class="title"><a href="AboutUs.html">About Us</a></div>
        <small class="footer_date">
            <p>created: 31/10/2025</p>
            <p>last updated: 07/11/2025</p>
        </small>
    </div>

    <script src = "BarFactors.js"></script>
</body>
</html>
