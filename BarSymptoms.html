<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disease Risk Factors Visualization</title>

    <!-- Include D3.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>

    <style>
        /* Page header and footer share some common styles (fixed, full width) */
        .header, .footer {
            position: fixed;
            left: 0;
            width: 100%;
            height: 15%;
            background-color: Lavender;
            color: black;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-sizing: border-box;
        }

        /* Header sits at the top of the viewport */
        .header {
            top: 0;
            padding: 0 15%;
        }

        /* Footer sits at the bottom of the viewport */
        .footer {
            bottom: 0;
            padding: 0 2%;
        }

        /* 
         Main body area: instead of fixing a height, anchor the bottom to
         the top of the footer (bottom: 15%). This ensures the body
         always fits between header and footer and prevents overlap.
        */
        .body {
            position: fixed;
            top: 15%;
            bottom: 15%;
            left: 0;
            width: 100%;
            color: black;
            padding: 2rem;
            overflow: auto;
            display: flex;
            gap: 2rem;
        }

        /* Centered title inside the header */
        .title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
        }

        /* Small right-aligned footer date column */
        .footer_date {
            text-align: right;
        }

        /* Loading message shown while fetching data */
        #loading-message {
            text-align: center;
            font-size: 18px;
            color: #333;
            margin: 20px 0;
        }

        /* Container that will hold the chart SVG */
        #barchart-container {
            flex: 1;
            min-width: 500px;
            /* ensure that the container allows space for axis labels */
            padding-bottom: 1rem;
        }

        /* Side panel that lists symptoms for the selected disease */
        #symptoms-panel {
            flex: 0 0 400px;
            background-color: #f5f5f5;
            border: 2px solid #FF69B4;
            border-radius: 8px;
            padding: 20px;
            overflow-y: auto;
            display: none;
        }

        /* Activate the panel when a disease is selected */
        #symptoms-panel.active {
            display: block;
        }

        .symptoms-title {
            font-size: 20px;
            font-weight: bold;
            color: #FF69B4;
            margin-bottom: 15px;
        }

        .symptoms-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .symptom-item {
            background-color: white;
            padding: 10px 12px;
            margin-bottom: 8px;
            border-left: 4px solid #FF69B4;
            border-radius: 4px;
            font-size: 14px;
        }

        /* Utility class to hide elements */
        .hidden {
            display: none;
        }

        /* Bar styling and hover effects */
        .bar {
            transition: opacity 0.3s, fill 0.3s;
            cursor: pointer;
        }

        .bar:hover {
            opacity: 0.8;
        }

        /* Active bar highlight */
        .bar.active {
            fill: #FF1493 !important;
        }

        /* Ensure axis text remains visible on dark/light backgrounds */
        svg text {
            fill: #000000;
        }
    </style>
</head>
<body>
    <!-- Header: back link, descriptive paragraph, and centered title -->
    <div class="header">
        <div><a href="BarCharts.html">Back</a></div>
        <p>For each disease linked to smoking, all the symptoms of that disease were extracted. Each symptom is linked to multiple disease. Click on a disease to see its symptoms.</p>
        <h1 class="title">Symptoms per Disease</h1>
        <div></div>
    </div>

    <!--
      Body: left side contains the chart, right side contains the symptoms list.
      Because .body is anchored with top:15% and bottom:15%, it will not be overlapped by header/footer.
    -->
    <div class="body">
        <div style="flex: 1;">
            <!-- Loading message while SPARQL fetch runs -->
            <div id="loading-message">Loading data...</div>
            <!-- Chart will be inserted into this container -->
            <div id="barchart-container"></div>
        </div>

        <!-- Sidebar panel that shows symptoms for a selected disease -->
        <div id="symptoms-panel">
            <div class="symptoms-title" id="selected-disease"></div>
            <ul class="symptoms-list" id="symptoms-list"></ul>
        </div>
    </div>

    <!-- Footer: simple logo, about link, and timestamps -->
    <div class="footer">
        <img src="um_logo.png" alt="Logo of Maastricht University" width="44.92" height="50.28">
        <div class="title"><a href="AboutUs.html">About Us</a></div>
        <small class="footer_date">
            <p>created: 2025/31/10</p>
            <p>last updated: 2025/11/21</p>
        </small>
    </div>
    <script src="BarSymptoms.js"></script>
</body>
</html>
